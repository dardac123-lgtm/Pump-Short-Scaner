name: Pump Short Scanner

on:
  workflow_dispatch:
  schedule:
    - cron: '2-59/5 * * * *'

permissions:
  contents: write

concurrency:
  group: pump-short-scanner
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 8

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Scan and alert
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          PUMP_THRESHOLD: '80'
          PUMP_HOURS: '24'
        run: python scanner.py

      - name: Quiet early analysis (no additional Telegram alerts)
        continue-on-error: true
        timeout-minutes: 3
        run: python pump_analysis.py

      - name: Save alert and OI history
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          git add alerts_state.json alerts_history.json oi_history.json
          if [ -f pump_analysis.json ]; then git add pump_analysis.json; fi

          if ! git diff --cached --quiet; then
            git commit -m 'Update pump alert history'
            git push
          fi
