              if os.getenv('GITHUB_STEP_SUMMARY'):
                  with open(os.environ['GITHUB_STEP_SUMMARY'],'a',encoding='utf-8') as fh:fh.write(report)
              if len(info)<20:
                  print('Test zakonczony niepowodzeniem: mniej niz 20 instrumentow',file=sys.stderr)
                  sys.exit(1)
          
