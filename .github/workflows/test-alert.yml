
name: Test Pump Alert

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Send test alert
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import urllib.parse
          import urllib.request
          from datetime import datetime, timezone
          from pathlib import Path

          token = os.environ["TELEGRAM_BOT_TOKEN"]
          chat_id = os.environ["TELEGRAM_CHAT_ID"]

          message = (
              "🚨 TEST SPYDON COIN 🚨\n\n"
              "Coin: TESTUSDT\n"
              "24h change: +120.00%\n"
              "Price: 0.12345 USDT\n\n"
              "To jest test, nie prawdziwy sygnał."
          )

          url = f"https://api.telegram.org/bot{token}/sendMessage"
          data = urllib.parse.urlencode({
              "chat_id": chat_id,
              "text": message
          }).encode()

          with urllib.request.urlopen(
              urllib.request.Request(url, data=data),
              timeout=20
          ) as response:
              result = json.load(response)

          if not result.get("ok"):
              raise RuntimeError("Telegram did not confirm delivery")

          path = Path("alerts_history.json")
          history = json.loads(path.read_text(encoding="utf-8")) if path.exists() else []

          history.append({
              "symbol": "TESTUSDT",
              "detected_at": datetime.now(timezone.utc).isoformat(),
              "change_percent": 120.0,
              "price": 0.12345,
              "threshold": 80,
              "telegram_sent": True
          })

          path.write_text(
              json.dumps(history, indent=2, ensure_ascii=False),
              encoding="utf-8"
          )

          print("TEST SPYDON COIN sent successfully")
          PY

      - name: Save test history
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add alerts_history.json
          if ! git diff --cached --quiet; then
            git commit -m "Add TEST SPYDON COIN alert"
            git push
          fi
