name: PUMP-SHORT - TEST 8 (nowa proba, bez alertow)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  research_8:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: WEEX 1m - proba na innych dniach i wielu coinach
        shell: bash
        run: |
          python3 - <<'PYCODE'
          import json, math, os, sys, time, urllib.parse, urllib.request, urllib.error, hashlib
          from datetime import datetime, timedelta, timezone
          from zoneinfo import ZoneInfo

          API = 'https://api-contract.weex.com/capi/v3/market/historyKlines'
          TZ = ZoneInfo('Europe/Oslo')
          MIN = 60000
          # Ustawienia WYŁĄCZNIE do eksperymentu, nie są zaleceniem transakcyjnym.
          WATCH_24H = 20
          WATCH_4H_LOW = 15
          WATCH_60M_LOW = 12
          WATCH_15M = 7
          WATCH_5M = 5
          BUY_DROP_PP = 10
          DECEL_PP = 4
          WICK_RATIO = .50
          WICK_PCT = 2
          ABSORB_VOLUME = 1.3

          def local_ms(s):
              return int(datetime.strptime(s, '%Y-%m-%d %H:%M').replace(tzinfo=TZ).timestamp()*1000)

          def stamp(ms):
              return datetime.fromtimestamp(ms/1000, timezone.utc).astimezone(TZ).strftime('%d.%m %H:%M')

          def pct(value, baseline):
              return 100*(value/baseline-1) if baseline is not None and baseline>0 else None

          def fmt(v):
              return 'n/d' if v is None else f'{v:+.2f}%'

          def get_candles(symbol, begin, finish):
              # Nie pobieramy świecy bieżącej ani minut historycznych, które jeszcze nie istnieją.
              now = int((datetime.now(timezone.utc)-timedelta(minutes=2)).timestamp()*1000)
              first, last = local_ms(begin), min(local_ms(finish), now)
              rows={}; calls=0
              if first>=last: raise RuntimeError(f'Brak zamknietych swiec dla {symbol}')
              for t in range(first,last+1,100*MIN):
                  end=min(last,t+99*MIN)
                  q=urllib.parse.urlencode({'symbol':symbol,'interval':'1m','startTime':t,'endTime':end,'limit':100,'priceType':'LAST'})
                  url=API+'?'+q
                  for attempt in range(5):
                      try:
                          r=urllib.request.Request(url,headers={'Accept':'application/json','User-Agent':'PUMP-SHORT-test-8-research/1.0'})
                          with urllib.request.urlopen(r, timeout=30) as response: data=json.load(response)
                          if not isinstance(data,list): raise ValueError('Nieoczekiwany format WEEX: '+str(data)[:150])
                          break
                      except (urllib.error.HTTPError,urllib.error.URLError, TimeoutError, ValueError) as exc:
                          if attempt==4: raise RuntimeError(f'Blad WEEX {symbol}: {exc}') from exc
                          time.sleep(min(2**attempt,8))
                  calls+=1
                  for record in data:
                      if not isinstance(record,list) or len(record)<11: continue
                      try:
                          key=int(record[0]); o,h,l,c=map(float,record[1:5]); volume=float(record[7]); buy=float(record[10])
                          if not(first<=key<=last and all(map(math.isfinite,(o,h,l,c,volume,buy)))): continue
                          if min(o,h,l,c)<=0 or l>min(o,c) or h<max(o,c) or volume<0 or buy<0 or buy>volume*1.001: continue
                          rows[key]={'t':key,'o':o,'h':h,'l':l,'c':c,'v':volume,'b':buy}
                      except (TypeError,ValueError,OverflowError): continue
                  time.sleep(.14)
              candles=[rows[x] for x in sorted(rows)]
              gaps={i for i in range(1,len(candles)) if candles[i]['t']-candles[i-1]['t']!=MIN}
              if len(candles)<300: raise RuntimeError(f'Za malo danych {symbol}: {len(candles)}')
              return candles,gaps,calls

          def share(items):
              total=sum(b['v'] for b in items)
              return 100*sum(b['b'] for b in items)/total if total>0 else None

          def features(rows,gaps):
              result=[]; seg=0
              for i,b in enumerate(rows):
                  if i in gaps: seg=i
                  if i-seg<240:
                      result.append(None); continue
                  # Baza jest z przeszłości. Nie wykorzystujemy przyszłego maksimum pompy.
                  min60=min(x['l'] for x in rows[i-60:i])
                  min240=min(x['l'] for x in rows[i-240:i])
                  r5=pct(b['c'],rows[i-5]['c'])
                  r15=pct(b['c'],rows[i-15]['c'])
                  r60=pct(b['c'],rows[i-60]['c'])
                  four_high=pct(b['h'],min240)
                  four_close=pct(b['c'],min240)
                  one_high=pct(b['h'],min60)
                  one_close=pct(b['c'],min60)
                  r24=pct(b['c'],rows[i-1440]['c']) if i-seg>=1440 else None
                  gates=[]
                  if r24 is not None and r24>=WATCH_24H: gates.append('24h')
                  if four_high>=WATCH_4H_LOW and four_close>=8: gates.append('wzrost_4h')
                  if one_high>=WATCH_60M_LOW and one_close>=6: gates.append('impuls_60m')
                  if r15>=WATCH_15M: gates.append('impuls_15m')
                  if r5>=WATCH_5M: gates.append('impuls_5m')
                  prev5=rows[i-9:i-4]; last5=rows[i-4:i+1]
                  buy_prev,buy_now=share(prev5),share(last5)
                  buy_drop=buy_prev-buy_now if buy_prev is not None and buy_now is not None else None
                  prev_r5=pct(rows[i-5]['c'],rows[i-10]['c'])
                  slowdown=prev_r5-r5
                  wick=(b['h']-max(b['o'],b['c']))/(b['h']-b['l']) if b['h']>b['l'] else 0
                  wick_percent=pct(b['h'],max(b['o'],b['c']))
                  oldvol=sum(x['v'] for x in prev5); newvol=sum(x['v'] for x in last5)
                  vol_ratio=newvol/oldvol if oldvol>0 else None
                  signs=[]
                  if buy_drop is not None and buy_drop>=BUY_DROP_PP: signs.append('kupujacy_slabna')
                  if prev_r5>1 and slowdown>=DECEL_PP: signs.append('momentum_hamuje')
                  if wick>=WICK_RATIO and wick_percent is not None and wick_percent>=WICK_PCT: signs.append('gorny_knot')
                  if vol_ratio is not None and vol_ratio>=ABSORB_VOLUME and prev_r5>2 and r5<=prev_r5*.4 and buy_now is not None and buy_now>=50:
                      signs.append('mozliwa_absorpcja')
                  result.append({'t':b['t'],'close':b['c'],'gates':gates,'signs':signs,'r24':r24,'r15':r15,'r5':r5,'r60':r60,'r4low':four_close,'buy5':buy_now,'buydrop':buy_drop})
              return result

          import csv
          from collections import Counter, defaultdict

          # Lista zamrozona na podstawie pliku instrumenty.csv z TEST 5. Nie zmieniamy jej
          # na podstawie wynikow TEST 6. Jest to test historyczny poza oknem TEST 5.
          BASE_COHORT = [
            ('BTCUSDT','duzy_obrot'), ('ETHUSDT','duzy_obrot'), ('1000PEPEUSDT','duzy_obrot'),
            ('BZUSDT','duzy_obrot'), ('GOOGLUSDT','duzy_obrot'), ('SOLUSDT','duzy_obrot'),
            ('SKHYNIXUSDT','duzy_obrot'), ('ZECUSDT','duzy_obrot'), ('BTWUSDT','duzy_obrot'),
            ('SNXXUSDT','przekroj'), ('CVXUSDT','przekroj'), ('RLCUSDT','przekroj'),
            ('MRVLUSDT','przekroj'), ('MAGMAUSDT','przekroj'), ('MYXUSDT','przekroj'),
            ('CUSDT','przekroj'), ('HUSDT','przekroj'), ('CCUSDT','przekroj'),
            ('ERAUSDT','liderzy_teraz'), ('GRVTUSDT','liderzy_teraz'), ('XNYUSDT','liderzy_teraz'),
            ('PHAUSDT','liderzy_teraz'), ('ALTUSDT','liderzy_teraz'), ('CTRUSDT','liderzy_teraz'),
            ('BATUSDT','liderzy_teraz'), ('METISUSDT','liderzy_teraz'), ('NILUSDT','liderzy_teraz'),
            ('CTUSDT','przyklady_uzytkownika'),('BRUSDT','przyklady_uzytkownika'),
            ('JCTUSDT','przyklady_uzytkownika')
          ]

          START_DOWNLOAD = '2026-10-01 00:00'  # 24h rozruch przed testem
          END_DOWNLOAD   = '2026-10-06 03:00'  # bufor na wynik do 120 minut
          START_TEST     = '2026-10-02 00:00'
          END_TEST       = '2026-10-06 00:00'  # okres rozlaczny z testami 5-7

          VARIANTS = (
              'BAZA',                       # dwa niezalezne sygnaly oslabienia
              'SILNY_IMPULS',              # r15 >=7% LUB r5 >=5%
              'BLISKO_MAKSIMUM',           # zamkniecie do 5% ponizej najwyzszej ceny ostatnich 60m
              'OBA_FILTRY',                # polaczenie powyzszych
          )

          # Dane sygnalowe i symulacje dla 60 i 120 min. Te same progi i 30 coinow co TEST 6.
          TP_LEVELS = (2,3,4,5)
          STOP = 5
          HORIZONS = (60,120)
          VARIANTS = ('BAZA','SILNY_IMPULS','BLISKO_MAKSIMUM','OBA_FILTRY')


          def passes(name, f, distance):
              if len(f['signs'])<2:
                  return False
              impulse=(f['r15'] is not None and f['r15']>=7) or (f['r5'] is not None and f['r5']>=5)
              near=(distance is not None and distance>=-5)
              return (name=='BAZA' or
                      (name=='SILNY_IMPULS' and impulse) or
                      (name=='BLISKO_MAKSIMUM' and near) or
                      (name=='OBA_FILTRY' and impulse and near))


          def get_signals(candles, ff, category, symbol):
              # Pierwszy kwalifikujacy sygnal w kazdym epizodzie DLA KAZDEGO WARIANTU.
              # Zmiana filtra moze opoznic sygnal, ale nigdy nie korzysta z przyszlych danych.
              # Nie jest to dowod poprawy. Porownania maja tylko charakter diagnostyczny.
              allowed_start, allowed_end = local_ms(START_TEST),local_ms(END_TEST)
              active_until=-1
              episode=0
              signals=[]
              sent=set()
              prev_t=None
              for i, f in enumerate(ff):
                  if f is None:
                      continue
                  if prev_t is not None and f['t']-prev_t!=MIN:
                      active_until=-1
                  prev_t=f['t']
                  if f['gates']:
                      if i>active_until:
                          episode+=1
                      active_until=i+30
                  if i>active_until or not (allowed_start<=f['t']+MIN<allowed_end):
                      continue
                  high60=max(x['h'] for x in candles[i-59:i+1])
                  distance=pct(f['close'],high60)
                  for variant in VARIANTS:
                      if (episode, variant) in sent or not passes(variant,f,distance):
                          continue
                      sent.add((episode,variant))
                      signals.append({
                          'symbol':symbol,'grupa':category,'wariant':variant,
                          'czas_oslo':stamp(f['t']+MIN),'cena_sygnalu':f['close'],
                          'cechy':'+'.join(f['signs']),'bramki':'+'.join(f['gates']),
                          'r5':f['r5'],'r15':f['r15'],'r24':f['r24'],'buy5':f['buy5'],
                          'odleglosc_od_szczytu_60m':distance,'index':i,
                      })
              return signals,episode


          def outcome(rows, index, target, stop, horizon):
              """TP/SL dla SHORT, na 1m. Swieca wyjscia: brak informacji o kolejnosci high/low.

              Ryzyko PRZED WYJSCIEM zawiera tylko ukonczone swiece przed swieca realizacji.
              Dla TP zakres gorny uwzglednia high swiecy TP, ale to jedynie MOZLIWY ruch przed TP.
              Dla SL ryzyko docelowe co najmniej stop%; rzeczywiste wypelnienie moze byc gorsze.
              """
              entry_i=index+1
              empty={'wynik':'brak_danych','minuty':'','cena_wejscia':'',
                     'ryzyko_przed_dolna':'','ryzyko_przed_gorna':'',
                     'ryzyko_po_sygnale_60m':'','zysk_po_sygnale_60m':'',
                     'osiagniete_tp_przed_sl':False}
              if entry_i+horizon>len(rows): return empty
              block=rows[entry_i:entry_i+horizon]
              if any(block[k]['t']-block[k-1]['t']!=MIN for k in range(1,len(block))): return empty
              entry=block[0]['o']
              if entry<=0: return empty
              high_before=entry
              tp_price=entry*(1-target/100)
              sl_price=entry*(1+stop/100)
              result=dict(empty)
              result['cena_wejscia']=entry
              for minute,b in enumerate(block,1):
                  tp=b['l']<=tp_price
                  sl=b['h']>=sl_price
                  if tp or sl:
                      lower=max(0,100*(high_before/entry-1))
                      upper=max(lower,100*(max(high_before,b['h'])/entry-1))
                      result.update({'minuty':minute,'ryzyko_przed_dolna':round(lower,4),
                                     'ryzyko_przed_gorna':round(upper,4)})
                      if tp and sl: result['wynik']='niejednoznaczne'
                      elif sl:
                          result['wynik']='SL'
                          # Dojscie do stopu jest pewne, ale ekstremum swiecy po stopie juz NIE.
                          result['ryzyko_przed_dolna']=max(lower,stop)
                          result['ryzyko_przed_gorna']=''
                      else:
                          result['wynik']='TP'
                          result['osiagniete_tp_przed_sl']=True
                      break
                  high_before=max(high_before,b['h'])
              else:
                  risk=round(max(0,100*(high_before/entry-1)),4)
                  result.update({'wynik':'brak_rozstrzygniecia', 'ryzyko_przed_dolna':risk,
                                 'ryzyko_przed_gorna':risk})
              # To jest ruch RYNKU od sygnalu, nawet PO mozliwym wyjsciu; nie traktowac jako MAE transakcji.
              window=rows[entry_i:entry_i+60]
              if len(window)==60 and all(window[k]['t']-window[k-1]['t']==MIN for k in range(1,60)):
                  result['ryzyko_po_sygnale_60m']=round(max(0,100*(max(b['h'] for b in window)/entry-1)),4)
                  result['zysk_po_sygnale_60m']=round(max(0,100*(1-min(b['l'] for b in window)/entry)),4)
              return result



          def cohort_from_exchange():
              """Select a deterministic, BEFORE-results sample of currently listed USDT perpetuals.
              Today's listing is an unavoidable survivorship bias, documented in the report.
              No price or performance data is used for inclusion.
              """
              url='https://api-contract.weex.com/capi/v3/market/exchangeInfo?contractType=PERPETUAL'
              for trial in range(4):
                  try:
                      req=urllib.request.Request(url,headers={'Accept':'application/json','User-Agent':'PUMP-SHORT-test-8-research/1.0'})
                      with urllib.request.urlopen(req,timeout=30) as response: info=json.load(response)
                      break
                  except Exception:
                      if trial==3:raise
                      time.sleep(2**trial)
              symbols=info.get('symbols')
              if not isinstance(symbols,list):raise ValueError('Brak symbols w exchangeInfo')
              names=set()
              for x in symbols:
                  if not isinstance(x,dict):continue
                  sym=x.get('symbol')
                  if (isinstance(sym,str) and sym.endswith('USDT') and x.get('quoteAsset')=='USDT'
                          and x.get('contractType')=='PERPETUAL'):
                      names.add(sym)
              if len(names)<100:raise RuntimeError('Za malo aktywnych instrumentow w exchangeInfo: '+str(len(names)))
              anchors=[(s,'poprzednia_proba') for s,_ in BASE_COHORT if s in names]
              anchor_names={s for s,_ in anchors}
              candidates=sorted(names-anchor_names, key=lambda s:hashlib.sha256(('PUMP-SHORT-TEST8-20261020:'+s).encode()).hexdigest())
              extras=[(s,'nowa_proba_losowa_deterministyczna') for s in candidates[:60]]
              return anchors+extras, len(names)


          def summarize(rows,variant,tp=3,duration=60):
              subset=[r for r in rows if r['wariant']==variant and r['tp_procent_ceny']==tp and r['horyzont_min']==duration]
              return Counter(x['wynik'] for x in subset),len(subset)


          def persist(path,rows,columns):
              with open(path,'w',encoding='utf-8-sig',newline='') as f:
                  w=csv.DictWriter(f,fieldnames=columns,extrasaction='ignore')
                  w.writeheader();w.writerows(rows)


          def main():
              from concurrent.futures import ThreadPoolExecutor, as_completed
              outdir='test8_output'
              os.makedirs(outdir,exist_ok=True)
              cohort,total_available=cohort_from_exchange()
              # Freeze the chosen instrument set IN THE REPORT before fetching any candles.
              persist(outdir+'/lista_wylosowanych_instrumentow.csv',
                      [{'symbol':s,'grupa':g} for s,g in cohort],['symbol','grupa'])
              print(f'TEST 8 / historyczny, {len(cohort)} wybranych z {total_available} aktywnych USDT perpetual',flush=True)
              print(f'Przedzial testu: {START_TEST} -> {END_TEST}, Oslo. Uwaga na survivorship bias.',flush=True)
              signals=[]; outcomes=[]; instrument_rows=[]; errors=[]
              signals_cols=['symbol','grupa','wariant','czas_oslo','cena_sygnalu','cechy','bramki',
                            'r5','r15','r24','buy5','odleglosc_od_szczytu_60m','cena_wejscia_test',
                            'wynik_TP3_SL5_60m','minuty_TP3_SL5_60m','MAE_przed_wyj_dolna_TP3_SL5',
                            'MAE_przed_wyj_gorna_TP3_SL5','ruch_rynku_przeciw_60m_po_sygnale',
                            'ruch_rynku_w_dol_60m_po_sygnale']
              outcomes_cols=['symbol','grupa','wariant','czas_oslo','cena_wejscia','tp_procent_ceny',
                             'sl_procent_ceny','horyzont_min','wynik','minuty','ryzyko_przed_dolna',
                             'ryzyko_przed_gorna','ryzyko_po_sygnale_60m','zysk_po_sygnale_60m']
              instrument_cols=['symbol','grupa','swiece','oczekiwane_swiece','pokrycie','luki','zapytania',
                               'epizody','sygnaly_bazowe']
              expected=(local_ms(END_DOWNLOAD)-local_ms(START_DOWNLOAD))//MIN+1

              def analyze(item):
                  symbol,category=item
                  candles,gaps,calls=get_candles(symbol,START_DOWNLOAD,END_DOWNLOAD)
                  ratio=len(candles)/expected
                  if ratio<.85:
                      raise RuntimeError(f'Pokrycie historycznych swiec tylko {ratio:.1%} ({len(candles)}/{expected})')
                  ff=features(candles,gaps)
                  events,episodes=get_signals(candles,ff,category,symbol)
                  these_signals=[]; these_outcomes=[]
                  for ev in events:
                      ix=ev.pop('index')
                      tested=outcome(candles,ix,3,5,60)
                      ev.update({'cena_wejscia_test':tested['cena_wejscia'],
                          'wynik_TP3_SL5_60m':tested['wynik'],'minuty_TP3_SL5_60m':tested['minuty'],
                          'MAE_przed_wyj_dolna_TP3_SL5':tested['ryzyko_przed_dolna'],
                          'MAE_przed_wyj_gorna_TP3_SL5':tested['ryzyko_przed_gorna'],
                          'ruch_rynku_przeciw_60m_po_sygnale':tested['ryzyko_po_sygnale_60m'],
                          'ruch_rynku_w_dol_60m_po_sygnale':tested['zysk_po_sygnale_60m']})
                      these_signals.append(ev)
                      for horizon in HORIZONS:
                          for tp in TP_LEVELS:
                              o=outcome(candles,ix,tp,STOP,horizon)
                              these_outcomes.append({'symbol':symbol,'grupa':category,'wariant':ev['wariant'],
                                  'czas_oslo':ev['czas_oslo'],'cena_wejscia':o['cena_wejscia'],
                                  'tp_procent_ceny':tp,'sl_procent_ceny':STOP,'horyzont_min':horizon,
                                  **{k:o[k] for k in ('wynik','minuty','ryzyko_przed_dolna','ryzyko_przed_gorna',
                                                       'ryzyko_po_sygnale_60m','zysk_po_sygnale_60m')}})
                  ins={'symbol':symbol,'grupa':category,'swiece':len(candles),'oczekiwane_swiece':expected,
                       'pokrycie':round(ratio,4),'luki':len(gaps),'zapytania':calls,
                       'epizody':episodes,'sygnaly_bazowe':sum(e['wariant']=='BAZA' for e in events)}
                  return these_signals,these_outcomes,ins

              # Three workers: limits run time while staying modest under WEEX request-weight caps.
              with ThreadPoolExecutor(max_workers=3) as pool:
                  tasks={pool.submit(analyze,item):item for item in cohort}
                  for ix,future in enumerate(as_completed(tasks),1):
                      symbol,category=tasks[future]
                      try:
                          ss,oo,inf=future.result()
                          signals.extend(ss);outcomes.extend(oo);instrument_rows.append(inf)
                          print(f'[{ix}/{len(cohort)}] {symbol}: ok, '+str(inf['sygnaly_bazowe'])+
                                f' bazowych; pokrycie {inf["pokrycie"]:.1%}',flush=True)
                      except Exception as exc:
                          errors.append({'symbol':symbol,'grupa':category,'problem':str(exc)[:400]})
                          print(f'[{ix}/{len(cohort)}] {symbol}: BRAK DANYCH / BLAD: {exc}',flush=True)

              # Primary interpretation: 1 signal max per coin per calendar day, separately for each variant.
              # This does not turn coin-day counts into independent observations; also count distinct coins.
              signals.sort(key=lambda s:(s['czas_oslo'][3:5],s['czas_oslo'][0:2],s['czas_oslo'][6:],s['symbol'],s['wariant']))
              seen=set(); independent_signals=[]
              for s in signals:
                  key=(s['symbol'],s['wariant'],s['czas_oslo'][:5])
                  if key not in seen:
                      seen.add(key);independent_signals.append(s)
              selected={(s['symbol'],s['wariant'],s['czas_oslo']) for s in independent_signals}
              independent_outcomes=[o for o in outcomes if (o['symbol'],o['wariant'],o['czas_oslo']) in selected]

              persist(outdir+'/sygnaly_surowe_test8.csv',signals,signals_cols)
              persist(outdir+'/rozliczenia_surowe_test8.csv',outcomes,outcomes_cols)
              persist(outdir+'/sygnaly_po_redukcji_coin_dzien_test8.csv',independent_signals,signals_cols)
              persist(outdir+'/rozliczenia_po_redukcji_coin_dzien_test8.csv',independent_outcomes,outcomes_cols)
              persist(outdir+'/instrumenty_test8.csv',sorted(instrument_rows,key=lambda r:r['symbol']),instrument_cols)
              persist(outdir+'/bledy_test8.csv',errors,['symbol','grupa','problem'])

              lines=['# PUMP-SHORT / TEST 8: niezalezniejsze proby i walidacja na innych dniach',
                     '',f'- Czas sygnalow: **{START_TEST} do {END_TEST} Oslo**; inny niz testy 5-7.',
                     f'- Lista instrumentow: {len(cohort)} z {total_available} obecnie dostepnych USDT perpetual;'
                     ' 30 poprzednio uzywanych (jesli nadal notowane) plus 60 dobranych deterministycznie po nazwie.',
                     '- WAZNE: losowanie dotyczy **obecnie notowanych** coinow, wiec moze wystapic survivorship bias.',
                     '- Nie wybieramy coinow ani progow po zobaczeniu wyniku testu 8.',
                     '- Algorytm wykrywania i warianty jak w testach 6-7; brak nowych progow dobieranych pod zyski.',
                     '- Symulacja: zamknieta swieca 1m, wejscie na otwarciu kolejnej, TP/SL liczone do chwili wyjscia.',
                     '- Dwie bariery w tej samej swiecy = niejednoznaczne.',
                     '- Wyniki hipotetyczne; bez rzeczywistych filli, prowizji, poslizgu, funding i OI; bez siatek.',
                     f'- Uzyte instrumenty: **{len(instrument_rows)}/{len(cohort)}**; bledy/braki danych: **{len(errors)}**.',
                     f'- Surowe sygnaly bazowe: {sum(s["wariant"]=="BAZA" for s in signals)}.',
                     f'- Po ograniczeniu do 1 sygnalu/coin/dzien: {sum(s["wariant"]=="BAZA" for s in independent_signals)}.',
                     f'- Unikalne coiny z sygnalem bazowym: {len({s["symbol"] for s in independent_signals if s["wariant"]=="BAZA"})}.',
                     '', '## Wyniki TP3/SL5 w 60 min, maksimum 1 sygnal na coin dzien',
                     '| Grupa | Wariant | Liczba | TP | SL | Niejedn. | Bez rozstrzygniecia | Brak danych | Rozne coiny |',
                     '|---|---|---:|---:|---:|---:|---:|---:|---:|']
              for group in ('razem','nowa_proba_losowa_deterministyczna','poprzednia_proba'):
                  group_rows=[o for o in independent_outcomes if group=='razem' or o['grupa']==group]
                  for variant in VARIANTS:
                      c,n=summarize(group_rows,variant)
                      unique=len({o['symbol'] for o in group_rows if o['wariant']==variant})
                      lines.append(f'| {group} | {variant} | {n} | {c["TP"]} | {c["SL"]} | '
                                   f'{c["niejednoznaczne"]} | {c["brak_rozstrzygniecia"]} | {c["brak_danych"]} | {unique} |')
              lines+=['','## Sam wariant podstawowy: TP2-5 / SL5 w horyzontach 60 i 120 min',
                      '| Horyzont | TP/SL (ruch ceny) | Liczba | TP | SL | Niejedn. | Bez rozstrzygniecia |',
                      '|---|---|---:|---:|---:|---:|---:|']
              for horizon in HORIZONS:
                  for tp in TP_LEVELS:
                      c,n=summarize(independent_outcomes,'BAZA',tp,horizon)
                      lines.append(f'| {horizon}m | {tp}%/5% | {n} | {c["TP"]} | {c["SL"]} | '
                                   f'{c["niejednoznaczne"]} | {c["brak_rozstrzygniecia"]} |')
              lines+=['','## Dystrybucja sygnalow bazowych po coinach',
                      '| Coin | Sygnaly surowe | Coin-dni |', '|---|---:|---:|']
              sraw=Counter(s['symbol'] for s in signals if s['wariant']=='BAZA')
              sdaily=Counter(s['symbol'] for s in independent_signals if s['wariant']=='BAZA')
              for symbol,n in sraw.most_common(20):
                  lines.append(f'| {symbol} | {n} | {sdaily[symbol]} |')
              lines+=['','## Ograniczenia, ktorych test NIE rozwiazuje',
                      '- Nawet coin-dni nie sa statystycznie niezalezne: ten sam dlugi ruch moze trwac kilka dni.',
                      '- Oszacowanie wyniku netto wymaga prowizji, spreadu, poslizgu i rzeczywistego sposobu wykonania.',
                      '- Symulowane TP/SL w procentach ceny nie sa ROI przy dzwigni.',
                      '- Nie testujemy reakcji na FVG, osobistych dokladek ani Cross.',
                      '- Brak historii OI i funding dla dat testowych. Nie imputujemy danych.',
                      '- To test historyczny, nie pozwala udowodnic przyszlej skutecznosci.',
                      '- Zadnych zmian w scanner.py, Telegramie, Netlify ani ustawieniach.',
                      '- Pelne CSV zapisane jako artifact w GitHub Actions.', '']
              if errors:
                  lines+=['## Pominiete instrumenty / bledy',
                          *[f'- {x["symbol"]}: {x["problem"]}' for x in errors[:30]]]
              report='\n'.join(lines)+'\n'
              with open(outdir+'/raport_test8.md','w',encoding='utf-8') as f:f.write(report)
              print('\n'+report,flush=True)
              if os.getenv('GITHUB_STEP_SUMMARY'):
                  with open(os.environ['GITHUB_STEP_SUMMARY'],'a',encoding='utf-8') as f:f.write(report)
              if len(instrument_rows)<40:
                  print('Zbyt mala liczba pelnych danych do sensownego podsumowania (min 40).',file=sys.stderr)
                  sys.exit(1)

          if __name__=='__main__':main()
          PYCODE
      - name: Zapisz raport i CSV
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: PUMP-SHORT-TEST-8-raport
          path: test8_output/
          if-no-files-found: warn
          retention-days: 30
