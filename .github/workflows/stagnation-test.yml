name: Test stagnation detector

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  observe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Detect breakout after stagnation (no Telegram)
        run: python stagnation_detector.py
      - name: Save observation results
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add stagnation_scan.json
          if ! git diff --cached --quiet; then
            git commit -m 'Update stagnation observation'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
